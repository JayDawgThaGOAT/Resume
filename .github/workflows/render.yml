name: Render CV

on:
  push:
    branches: [main]
    paths:
      - Jalen_Jackson_CV.yaml
      - .github/workflows/render.yml
      - requirements.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install RenderCV
        run: pip install -r requirements.txt

      - name: Render CV
        run: rendercv render Jalen_Jackson_CV.yaml --output-folder "$GITHUB_WORKSPACE/rendercv_output"

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: re-render CV outputs"
          file_pattern: rendercv_output/
