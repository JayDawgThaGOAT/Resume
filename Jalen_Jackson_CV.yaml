design:
  theme: engineeringclassic
  page:
    size: us-letter
    top_margin: 0.5in
    bottom_margin: 0.5in
    left_margin: 0.5in
    right_margin: 0.5in
    show_footer: false
    show_top_note: false
  typography:
    line_spacing: 0.85em
    font_family:
      body: Raleway
      name: Raleway
      headline: Raleway
      connections: Raleway
      section_titles: Raleway
    font_size:
      body: 10pt
      name: 25pt
      headline: 10pt
      connections: 9pt
      section_titles: 1.2em
    bold:
      name: false
      headline: false
      connections: false
      section_titles: false
  colors:
    name: rgb(0,0,0)
    connections: rgb(0,0,0)
    section_titles: rgb(0,0,0)
    links: rgb(0,0,0)
  section_titles:
    type: with_full_line
    line_thickness: 0.5pt
    space_above: 0.7cm
    space_below: 0.45cm
  sections:
    space_between_regular_entries: 0.7cm
    space_between_text_based_entries: 0.25cm
    show_time_spans_in: []
  entries:
    date_and_location_width: 4.15cm
    short_second_row: false
    summary:
      space_above: 0.25cm
    highlights:
      bullet: "●"
      nested_bullet: "●"
      space_left: 0cm
      space_above: 0.25cm
      space_between_items: 0.2cm
      space_between_bullet_and_text: 0.3em
