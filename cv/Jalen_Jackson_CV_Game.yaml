# yaml-language-server: $schema=https://raw.githubusercontent.com/rendercv/rendercv/refs/tags/v2.8/schema.json

cv:
  name: Jalen Jackson
  headline: "Unity & Unreal Engineer: Gameplay Systems & Mobile"
  email: jackson.jalen@proton.me
  social_networks:
    - network: LinkedIn
      username: jalen-jackson
    - network: GitHub
      username: JayDawgThaGOAT

  sections:
    summary:
      - "Software Engineer with 5+ years of Unity C# and Unreal C++ experience, shipping gameplay systems and production mobile titles across iOS, Android, and Apple Arcade."

    experience:
      - company: Zynga
        position: "Software Engineer, Identities"
        start_date: 2023-01
        end_date: present
        location: Remote
        highlights:
          - "Migrated the C++ authentication SDK from reCAPTCHA Classic to Enterprise for Unreal Engine 5 iOS, packaging Swift frameworks via CMake for cross-platform engine plugin use"
          - "Gated Apple Game Center login behind iOS Lockdown Mode across both C# and C++ SDKs, using dependency injection so non-iOS platforms compile cleanly without the guard"
          - "Built a real-time push notification package for Unity C# that lets games refresh account UI immediately after email verification, without polling the backend"
          - "Fixed a callback bug in the C++ Unreal layer that left stale account state across attach, detach, and email-update flows, aligning C++ behavior with C# without breaking existing customers"
          - "Forward-ported Unreal UI fixes and resolved merge conflicts across release branches to ship reCAPTCHA v3 into a production title"

      - company: Playdots
        position: "Software Engineer, Unity"
        start_date: 2021-06
        end_date: 2023-01
        location: Remote
        highlights:
          - "Owned core gameplay systems in Unity C# for Two Dots, a top-100 mobile title, delivering the level editor pipeline and mechanics that powered ongoing releases"
          - "Led Garden Tails from alpha to Apple Arcade global release, architecting the localization pipeline and ensuring App Store compliance for worldwide distribution"
          - "Shipped Unity C# monetization systems for Garden Tails, including an MVC Credits scene and in-game economy features that drove player re-engagement"

    education:
      - institution: "California State University, Fullerton"
        area: Computer Science
        degree: B.S.
        end_date: 2021-01
        location: "Fullerton, CA"

    skills:
      - label: "Engines & Languages"
        details: "Unity (C#), Unreal Engine 5 (C++), Godot (GDScript), Objective-C++"
      - label: "Platforms & Build"
        details: "iOS, Android, Apple Arcade, CMake, xcframework, Xcode, UPM"

design:
  theme: engineeringclassic
  page:
    size: us-letter
    top_margin: 0.5in
    bottom_margin: 0.5in
    left_margin: 0.5in
    right_margin: 0.5in
    show_footer: false
    show_top_note: false
  typography:
    line_spacing: 0.85em
    font_family:
      body: Raleway
      name: Raleway
      headline: Raleway
      connections: Raleway
      section_titles: Raleway
    font_size:
      body: 10pt
      name: 25pt
      headline: 10pt
      connections: 9pt
      section_titles: 1.2em
    bold:
      name: false
      headline: false
      connections: false
      section_titles: false
  colors:
    name: rgb(0,0,0)
    connections: rgb(0,0,0)
    section_titles: rgb(0,0,0)
    links: rgb(0,0,0)
  section_titles:
    type: with_full_line
    line_thickness: 0.5pt
    space_above: 0.7cm
    space_below: 0.45cm
  sections:
    space_between_regular_entries: 0.7cm
    space_between_text_based_entries: 0.25cm
    show_time_spans_in: []
  entries:
    date_and_location_width: 4.15cm
    short_second_row: false
    summary:
      space_above: 0.25cm
    highlights:
      bullet: "●"
      nested_bullet: "●"
      space_left: 0cm
      space_above: 0.25cm
      space_between_items: 0.2cm
      space_between_bullet_and_text: 0.3em
